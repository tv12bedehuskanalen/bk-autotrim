name: Build installers
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            platform: darwin
          - os: macos-15-intel
            arch: x64
            platform: darwin
          - os: windows-latest
            arch: x64
            platform: win32
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: startsWith(github.ref, 'refs/tags/')
        run: npm run verify:release
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: actions/cache/restore@v4
        id: media
        with:
          path: vendor
          key: media-v1-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/build-media.sh') }}
      - if: runner.os == 'macOS' && steps.media.outputs.cache-hit != 'true'
        run: brew install nasm pkg-config
      - if: runner.os == 'Windows' && steps.media.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git curl tar nasm
            mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ffnvcodec-headers mingw-w64-x86_64-zlib
      - if: runner.os == 'Windows' && steps.media.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-media.sh
      - if: runner.os == 'macOS' && steps.media.outputs.cache-hit != 'true'
        run: bash scripts/build-media.sh
      - run: node scripts/verify-media.cjs
      - uses: actions/cache/save@v4
        if: steps.media.outputs.cache-hit != 'true'
        with:
          path: vendor
          key: ${{ steps.media.outputs.cache-primary-key }}
      - run: npm run test:media
      - run: npx electron-builder --publish never --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: node scripts/verify-packaged.cjs ${{ matrix.platform }} ${{ matrix.arch }}
      - run: node scripts/smoke-packaged.cjs ${{ matrix.platform }} ${{ matrix.arch }}
      - run: node scripts/verify-artifact.cjs ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: BK-Autotrim-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            vendor/media-sources.tar.gz
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - name: Give source archives unique platform names
        run: |
          find release-files -name media-sources.tar.gz | while read file; do
            directory=$(dirname "$(dirname "$file")")
            mv "$file" "$(dirname "$file")/$(basename "$directory")-media-sources.tar.gz"
          done
      - name: Generate checksums
        run: |
          find release-files -type f ! -name SHA256SUMS -exec sha256sum {} \; | sed 's|  .*/|  |' > release-files/SHA256SUMS
      - name: Create release with all tested installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "BK Autotrim $GITHUB_REF_NAME" --generate-notes $(find release-files -type f)
